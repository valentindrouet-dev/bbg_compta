<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>" />
    <title>BBG Compta</title>
    <script type="module" crossorigin src="/bbg_compta/assets/index-CP3uCGt7.js"></script>
    <link rel="stylesheet" crossorigin href="/bbg_compta/assets/index-BGCPZcrD.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Cet index.html est celui du mode développement (il charge du TypeScript).
      // S'il est servi tel quel par GitHub Pages, c'est que Pages pointe sur le
      // dossier racine au lieu de /docs : on l'explique au lieu d'une page blanche.
      // Dans le build, la balise main.tsx est réécrite vers le bundle : ce guard
      // ne trouve alors plus main.tsx et reste totalement inerte en production.
      document.addEventListener('DOMContentLoaded', function () {
        var dev = document.querySelector('script[src*="main.tsx"]');
        var root = document.getElementById('root');
        if (dev && location.hostname.endsWith('github.io') && root && !root.children.length) {
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:640px;margin:80px auto;padding:0 24px;color:#1f2937">' +
            '<h1 style="font-size:22px">⚙️ Mauvais dossier configuré dans GitHub Pages</h1>' +
            '<p>Cette page est la version <b>source</b> du site, pas la version construite.</p>' +
            '<p>Pour corriger : <b>Settings → Pages → Build and deployment</b>, garder la même branche ' +
            'mais choisir le dossier <b>/docs</b> (au lieu de <b>/ (root)</b>), puis Save. ' +
            'Le site sera en ligne une à deux minutes après.</p></div>';
        }
      });
    </script>
  </body>
</html>
